# Local infrastructure for the full-stack API (Steps 6-8 in the README).
# The Milvus, etcd and MinIO services follow Milvus's own standalone compose file
# for v3.0.3 (milvus-standalone-docker-compose.yaml in the Milvus release assets).
# Credentials are local development defaults. The PostgreSQL ones and its port can
# be overridden with the variables in .env.example.

x-milvus-image: &milvus-image milvusdb/milvus:v3.0.3

services:
  # PostgreSQL for product metadata and job tracking
  postgres:
    image: postgres:16
    container_name: streambuy-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: streambuy_features
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d streambuy_features"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Milvus standalone for vector similarity search
  # One-time step from Milvus's compose file: give the Milvus user ownership of its volume
  milvus-volume-init:
    image: *milvus-image
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        chown -R "$${uid}:$${gid}" /var/lib/milvus
    volumes:
      - milvus_data:/var/lib/milvus

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: streambuy-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: streambuy-minio
    environment:
      # Milvus connects with its default MinIO credentials, so keep these as they are
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: *milvus-image
    container_name: streambuy-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
