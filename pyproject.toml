[project]
name = "playbook-02-multimodal-feature-store-streambuy"
version = "2026.10"
description = "StreamBuy: a multimodal feature store for product images, reviews and videos (Data Engineering for Multimodal AI, Chapter 2)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.2",
    "pydantic>=2.5",
    "pymilvus>=2.5,<3.1",          # 3.1 removes the ORM API (connections, Collection, utility) used in src/db/milvus.py
    "sentence-transformers>=4.0",
    "torch>=2.3",
    "torchvision>=0.18",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

# On Linux, PyPI's torch is the CUDA build (several GB of CUDA libraries plus Triton).
# This playbook runs on CPU, so Linux gets the CPU build. macOS and Windows use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
